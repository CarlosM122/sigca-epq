spring.application.name=sigca-epq

# --- Conexión a Oracle (se pueden sobrescribir con variables de entorno) ---
# Servicio: XEPDB1 en Oracle XE 18c/21c, FREEPDB1 en Oracle 23ai Free, o el de tu instancia.
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:software2}
spring.datasource.password=${DB_PASSWORD:software2}

# La estructura la manejan los scripts SQL (V1__...), no Hibernate.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Orígenes del frontend autorizados a llamar la API (separados por coma)
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:4200}
