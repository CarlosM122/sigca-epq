# Oracle 23 Free para desarrollo local. Después de que esté "healthy", instalar el esquema con
# los scripts de modelo-datos/sql (ver README).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: sigca-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-OraSys2026x}
      # SYSTIMESTAMP en la hora de Colombia, igual que la JVM (fechas de pago, registro, etc.)
      TZ: America/Bogota
    volumes:
      - oracle-datos:/opt/oracle/oradata
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      retries: 30
volumes:
  oracle-datos:
